name: Cloudflare CLI E2E

on:
  workflow_dispatch:

permissions:
  contents: read

# Secrets Store is shared at account scope. Do not overlap lifecycle runs.
concurrency:
  group: cloudflare-cli-e2e-mail-hayami
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/main'
    name: Create, update, and destroy on the Gmail test account
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-cli-e2e
    env:
      CLOUDFLARE_ACCOUNT_ID: bf981465797159e6eb390ded4e51b479
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Isolate E2E state and Wrangler configuration
        run: |
          echo "CLI_E2E_ARTIFACT_DIR=$RUNNER_TEMP/form-concierge-cli-e2e" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/form-concierge-cli-e2e-auth" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Install CLI and deployment tools
        timeout-minutes: 10
        run: |
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          dart pub global activate jaspr_cli 0.23.4
          dart pub get --directory cli
          npm ci --prefix worker

      - name: Run the real CLI lifecycle
        timeout-minutes: 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_CLI_E2E_API_TOKEN }}
          CF_CLI_E2E_WORKER_API_TOKEN: ${{ secrets.CF_CLI_E2E_WORKER_API_TOKEN }}
        run: node tool/cloudflare/cli_e2e.mjs run

      - name: Clean up only resources owned by this run
        if: always()
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_CLI_E2E_API_TOKEN }}
        run: node tool/cloudflare/cli_e2e.mjs cleanup

      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cli-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLI_E2E_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
