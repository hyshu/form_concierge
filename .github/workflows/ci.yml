name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, analysis, builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.9"
          cache: true

      - name: Add Dart pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run static checks and unit tests
        run: bash tool/ci/static_checks.sh

      - name: Test Cloudflare CLI lifecycle orchestration without credentials
        run: node --test tool/cloudflare/cli_e2e.test.mjs

  e2e:
    name: Docker localhost E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run API, admin, web, and Flutter embedded form E2E in Docker
        run: docker compose -f tool/ci/docker-compose.e2e.yml run --rm e2e

  swift:
    name: Swift package tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Test Apple Swift package
        working-directory: apple
        run: swift test

  android:
    name: Android Compose tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "9.8.2"

      - name: Test and build Compose library
        run: >-
          gradle -p android
          :form-concierge-compose:testDebugUnitTest
          :form-concierge-compose:lintRelease
          :form-concierge-compose:assembleRelease
