name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, analysis, builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Add Dart pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run static checks and unit tests
        run: bash tool/ci/static_checks.sh

  e2e:
    name: Docker localhost E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Run API, admin, web, and Flutter embedded form E2E in Docker
        run: docker compose -f tool/ci/docker-compose.e2e.yml run --rm e2e

  swift:
    name: Swift package tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Test Apple Swift package
        working-directory: apple
        run: swift test

  android:
    name: Android Compose tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Test and build Compose library
        run: >-
          gradle -p android
          :form-concierge-compose:testDebugUnitTest
          :form-concierge-compose:lintRelease
          :form-concierge-compose:assembleRelease
